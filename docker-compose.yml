# Local development services: PostgreSQL with pgvector, and Redis for Celery.
# The Django app, the Celery worker and the Vite dev server run on the host
# (see README.md). Credentials match backend/.env.example.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pulchowk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # 5433 on the host, so it does not clash with a local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulchowk"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
